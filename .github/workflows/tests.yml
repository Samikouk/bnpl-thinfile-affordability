name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy pandas
      - run: python -m pytest -q

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bnpl-cure-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bnpl-cure-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
